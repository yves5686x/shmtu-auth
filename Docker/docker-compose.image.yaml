# 拉取 GitHub Actions 构建的镜像，服务器不需要本地构建。
services:
  shmtu-auth:
    image: ${SHMTU_AUTH_IMAGE:-ghcr.io/yves5686x/shmtu-auth:feat-portal-captcha}
    pull_policy: missing
    container_name: shmtu-auth
    restart: unless-stopped
    network_mode: host
    # 账号可直接在网页填写；下面的空默认值支持不创建 .env 就启动。
    environment:
      SHMTU_AUTH_WEB: ${SHMTU_AUTH_WEB:-true}
      SHMTU_AUTH_USER_LIST: ${SHMTU_AUTH_USER_LIST:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
