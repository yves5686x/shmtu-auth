version: "3.8"

services:
  shmtu-auth-headless:
    build:
      context: ..
      dockerfile: docker_headless/Dockerfile
    image: shmtu-auth-headless:local
    container_name: shmtu-auth-headless
    restart: unless-stopped
    # 必须用 host 网络，有两个原因：
    #   1. 容器要看得到宿主机的物理网卡，设备号（物理 MAC）才取得对
    #   2. 门户认证的设备标识才能和宿主自洽
    network_mode: host
    # 所有配置都写在同目录的 .env 里（从 .env.example 复制）
    env_file:
      - .env
    # 资源限制：onnxruntime + opencv 常驻内存约 200MB，128M 会 OOM
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
