name: Build and publish Docker image

on:
  push:
    branches: ['**']
    tags: ['v*', 'latest']
    paths:
      - 'Docker/**'
      - 'src/shmtu_auth/**'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker-image-ghcr.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image name and build information
        id: image
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('src/shmtu_auth/src/config/build_info.py')
          source = path.read_text()
          timestamp = datetime.now(timezone.utc).isoformat(timespec='seconds')
          source = re.sub(r'^docker_build_time = .*$', lambda m: f'docker_build_time = {timestamp!r}', source, flags=re.M)
          source = re.sub(r'^branch = .*$', lambda m: f'branch = {os.environ["BUILD_BRANCH"]!r}', source, flags=re.M)
          path.write_text(source)
          PY

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: shmtu-auth:ci
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

      - name: Verify OCR and CLI startup in the image
        run: |
          docker run --rm --entrypoint python shmtu-auth:ci -c 'import ddddocr; from shmtu_auth.src.core.core import ShmtuNetAuthCore; ddddocr.DdddOcr(show_ad=False); print("OCR model and authentication imports OK")'
          set +e
          docker run --rm shmtu-auth:ci > cli-startup.log 2>&1
          status=$?
          set -e
          cat cli-startup.log
          test "$status" -eq 1
          grep -q 'No valid accounts configured' cli-startup.log

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

  publish:
    name: Publish multi-platform tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare branch, release and commit tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Combine tested amd64 and arm64 images
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          while IFS= read -r tag; do
            echo "Published: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
