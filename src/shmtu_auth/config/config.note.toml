[global]
# 机器名称
SHMTU_MACHINE_NAME = ""

[Network]
# 网络检查重试次数
SHMTU_AUTH_NETWORK_CHECK_RETRY_TIMES = 3
# 网络检查重试间隔
SHMTU_AUTH_NETWORK_CHECK_RETRY_TIME_INTERVAL = 30

[Auth]
# 认证检测间隔
SHMTU_AUTH_TIME_INTERVAL = 10

[Portal]
# 门户登录使用的 service 参数（不带百分号）
#   不写 = 依次尝试「校园网」（有线）和「iSMU」（无线），哪个能通就用哪个。
#          不按当前网络类型二选一，因为容器 / 网关代拨场景下这个判断经常不准。
#   写了 = 只试这一个，不再兜底（方便排查问题）
# 注意：TOML 配置优先级高于环境变量，这里一旦写了值环境变量就失效；
#       只想临时改请用环境变量 SHMTU_AUTH_PORTAL_SERVICE。
#SHMTU_AUTH_PORTAL_SERVICE = ""
# 是否启用 OCR 自动识别验证码
#   关闭后直接弹窗请用户输入（无头环境请保持开启）
#SHMTU_AUTH_CAPTCHA_OCR = true
# 验证码自动重试次数（验证码是一次性的，每次重试都会换一张新图）
#   无头环境没有弹窗兜底，识别失败只能重来，所以默认给得比较宽松
#SHMTU_AUTH_CAPTCHA_MAX_RETRY = 6

# 下面的配置项暂时没有用到
[Notify]
# 企业微信WebHook
SHMTU_AUTH_WEBHOOK_WEWORK = ""
# 睡眠时间段
SHMTU_WEBHOOK_SLEEP_TIME_START = "23:00"
SHMTU_WEBHOOK_SLEEP_TIME_END = "7:00"
